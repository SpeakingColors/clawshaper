<title>ClawShaper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one fixed 1280 x 720 stage scaled as a piece (reused from the sibling MultiPaw mockup). Wood cheeks left and right; header; one page with the shaper; preview rig under it. */
:root{
  --bg:#0b0b0d; --plate:#16171a; --plate2:#1e2024; --line:#33363d; --ink:#f4f5f7; --dim:#a9adb8;
  --title:#e8e9ee; --accent:#02EBBA; --disp:#06080a; --grid:#1b2523;
  --g:#02EBBA; --y:#FFD100; --o:#F57F01; --r:#FF1383; --b:#6CC9F5; --p:#A43DFF;
  --sel:#241238; --selb:#CD92FE; --pink:#FF7BB1;
  --b0:#6CC9F5; --b1:#02EBBA; --b2:#FFD100; --b3:#FF7BB1;
  --font-ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-num:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  color-scheme:dark;
}
#app[data-look="A"]{--bg:#161638;--plate:#1c1c4a;--plate2:#2C2C62;--line:#3d4a66;--ink:#e8e6e1;--dim:#a8a4c8;--title:#E1CBF4;--accent:#FFA600;--disp:#05060d;--y:#FFA600}
#app[data-look="B"]{--bg:#0b0b0d;--plate:#15161a;--plate2:#1c1d22;--line:#2b2d34;--ink:#f4f5f7;--dim:#a9adb8;--title:#E1CBF4;--accent:#A43DFF;--disp:#06080a}
html,body{background:var(--bg);margin:0}
#stage,#stage *{box-sizing:border-box}
body{color:var(--ink);font-family:var(--font-ui);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
#app{background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
#frame{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;display:flex;background:#000;user-select:none;-webkit-user-select:none}
.cheek{width:52px;flex:none;position:relative;cursor:default}
.cheek canvas{width:100%;height:100%;display:block}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--plate);position:relative}
.hdr{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--plate2)}
.brand{display:flex;align-items:center;gap:7px;width:176px;flex:none}
.brand .name{font-style:italic;font-weight:800;font-size:23px;letter-spacing:.5px;color:#fff;line-height:1;display:flex;align-items:baseline;white-space:nowrap}
.brand .name i{color:var(--accent);font-style:italic;margin-left:1px}
.brand .s87{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.sp{flex:1}
button,select,input{font-family:var(--font-ui)}
.btn{background:var(--plate);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 9px;font-size:14px;letter-spacing:.5px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn:focus-visible,.knob:focus-visible,.led-hit:focus-visible,.chip:focus-visible,.rh:focus-visible,.seg button:focus-visible,select:focus-visible{outline:2px solid var(--selb);outline-offset:2px}
.btn.on{background:var(--sel);border-color:var(--selb);color:#E1CBF4}
.presetbar{display:flex;align-items:center;gap:4px;flex:none}
.presetbar .pname{width:176px;text-align:center;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.page{position:absolute;left:0;top:0;right:0;bottom:40px;padding:6px 8px 0}
.page[hidden]{display:none}
.rig{height:40px;flex:none;border-top:1px solid var(--line);background:var(--plate2);display:flex;align-items:center;gap:8px;padding:0 10px;position:absolute;left:0;right:0;bottom:0}
.rig select,.sel{background:var(--disp);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-size:14px;height:24px}
.rig .hint{font-size:12px;color:var(--dim);white-space:nowrap}
.rig .tag{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);border:1px dashed var(--line);padding:1px 6px;border-radius:3px;white-space:nowrap}
.rig label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px;white-space:nowrap}
.rig .rd{font-family:var(--font-num);font-size:11px;color:var(--ink);white-space:nowrap}
.rig .rd b{color:var(--accent);font-weight:600}
.foot{height:24px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;color:var(--dim);letter-spacing:1px;border-top:1px solid var(--line);background:var(--plate2)}
.cap{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--title);white-space:nowrap}
canvas{display:block}
.cv{background:var(--disp);border:1px solid var(--line);border-radius:3px}
/* knob */
.kb{display:flex;flex-direction:column;align-items:center;flex:none}
.kb .kv{font-family:var(--font-num);font-size:10.5px;color:var(--ink);height:13px;white-space:nowrap;line-height:13px}
.kb .kl{font-size:12px;letter-spacing:.8px;color:var(--title);font-weight:600;white-space:nowrap;line-height:13px;text-transform:uppercase}
.ro-off .kb .kv{visibility:hidden}
.knob{cursor:ns-resize;touch-action:none;border-radius:50%;display:block}
.knob svg{display:block}
.knob:hover .body{filter:brightness(1.1)}
.pw{width:16px;height:16px;border-radius:50%;border:1px solid #000;background:#3a0a1c;box-shadow:inset 0 0 3px #000;cursor:pointer;padding:0;flex:none;position:relative}
.pw.on{background:var(--r);box-shadow:0 0 8px 1px var(--r),inset 0 0 3px rgba(255,255,255,.5)}
.pw.g.on{background:var(--g);box-shadow:0 0 8px 1px var(--g),inset 0 0 3px rgba(255,255,255,.5)}
.tgb{background:var(--plate);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:12px;height:20px;cursor:pointer;white-space:nowrap;letter-spacing:.4px}
.tgb:hover{border-color:var(--dim)}
.tgb.on{background:var(--sel);border-color:var(--selb);color:#E1CBF4}
.tgb.yel.on{background:#3a3300;border-color:var(--y);color:var(--y)}
.seg{display:flex}
.seg button{background:var(--plate);color:var(--ink);border:1px solid var(--line);padding:0 8px;font-size:13px;height:24px;cursor:pointer;white-space:nowrap}
.seg button+button{margin-left:-1px}
.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button.on{background:var(--sel);border-color:var(--selb);color:#E1CBF4;position:relative;z-index:1}
.rad{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:13px;letter-spacing:.5px;color:var(--ink);background:none;border:0;padding:0 4px;white-space:nowrap}
.rad .lp{width:11px;height:11px;border-radius:50%;background:#26282c;box-shadow:inset 0 0 2px #000;flex:none}
.rad.on .lp{background:var(--y);box-shadow:0 0 7px 1px var(--y)}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;color:var(--ink);background:none;border:0;padding:0;white-space:nowrap}
.chk .bx{width:13px;height:13px;border:1px solid var(--dim);border-radius:2px;background:var(--disp);flex:none}
.chk.on .bx{background:var(--accent);border-color:var(--accent)}
/* page 1 */
.p1{display:grid;grid-template-columns:104px 1fr 156px;gap:8px;height:248px}
.sidecol{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.sidecol .row2{display:flex;gap:4px;justify-content:center}
.ctr{position:relative;min-width:0}
.gtop{height:44px;display:flex;align-items:center;gap:8px}
.gtop .mixwrap{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.gtop .mixwrap .kb{flex-direction:column}
.mixnote{font-size:11px;color:var(--dim);letter-spacing:.4px;max-width:150px;line-height:1.05}
.gright{margin-left:auto;display:flex;gap:6px;align-items:center}
.msrow{position:relative;height:22px;margin-top:2px}
.ms{position:absolute;top:0;height:22px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.strips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.strip{border:1px solid var(--line);border-radius:4px;background:var(--plate2);display:flex;flex-direction:column;min-width:0;height:344px;overflow:hidden;position:relative}
.strip[data-off="1"]{opacity:.42}
.strip .tpart{height:96px;padding:4px 6px 0;border-bottom:1px solid var(--line);position:relative}
.strip .l1{display:flex;align-items:center;gap:6px;height:32px}
.bsel{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.bsel .btn{padding:0 5px;height:22px;font-size:12px}
.bsel .nm{flex:1;min-width:0;height:22px;background:var(--disp);border:1px solid var(--line);border-radius:3px;font-size:13px;color:var(--title);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;white-space:nowrap}
.strip .cl{display:flex;flex-direction:column;height:124px;border-bottom:1px solid var(--line);padding:3px 6px}
.sec{position:relative;padding:3px 6px}
.sec .st{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--ink);display:flex;align-items:center;gap:6px;height:18px}
.sec .krow{display:flex;gap:6px;align-items:flex-start;justify-content:flex-start}
.sec.c{width:172px;border-right:1px solid var(--line)}
.sec.l{flex:1}
.strip .dpart{flex:1;padding:4px 6px;position:relative}
.dprow{display:flex;gap:6px}
.dpcol{display:flex;flex-direction:column;gap:3px}
.vbtn{height:20px;width:46px}
.dpbot{display:flex;align-items:center;gap:4px;margin-top:4px}
.dpbot .tgb{flex:none}
/* overlays */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30}
#modal[hidden]{display:none}
.dlg{width:760px;max-height:640px;background:var(--plate);border:1px solid var(--selb);border-radius:8px;display:flex;flex-direction:column;box-shadow:0 10px 40px #000}
.dlg h2{margin:0;padding:10px 16px;font-size:20px;letter-spacing:1px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--title)}
.dlg .dbody{padding:12px 16px;overflow:auto;font-size:15px;line-height:1.35;min-height:0}
.dlg .dfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dlg label{display:flex;align-items:center;gap:8px;margin:6px 0}
.dlg input[type=text],.dlg input:not([type]),.dlg select,.dlg textarea{background:var(--disp);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:15px}
.dlg textarea{width:100%;height:230px;font-family:var(--font-num);font-size:12px}
.dlg kbd{font-family:var(--font-num);font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 5px;background:var(--disp)}
.dlg table{border-collapse:collapse;width:100%}
.dlg td{padding:3px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pb{display:grid;grid-template-columns:300px 1fr;gap:14px;height:380px}
.pb .list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:auto;background:var(--disp)}
.pb .item{padding:5px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);font-size:15px}
.pb .item.sel{background:var(--sel);color:#E1CBF4}
.pb .item small{color:var(--dim);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--disp);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:1px 9px;font-size:13px;cursor:pointer}
.chip.on{background:var(--sel);border-color:var(--selb);color:#E1CBF4}
.warn{color:var(--r)}
#tip{position:absolute;max-width:320px;background:#000;border:1px solid var(--selb);color:var(--ink);padding:6px 9px;border-radius:5px;font-size:14px;line-height:1.25;z-index:50;pointer-events:none}
#tip[hidden]{display:none}
#toast{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);background:#000;border:1px solid var(--selb);padding:5px 14px;border-radius:5px;font-size:15px;z-index:60}
#toast[hidden]{display:none}
.rh{position:absolute;z-index:20;background:transparent}
.rh.n{left:12px;right:12px;top:-4px;height:8px;cursor:ns-resize}.rh.s{left:12px;right:12px;bottom:-4px;height:8px;cursor:ns-resize}
.rh.e{top:12px;bottom:12px;right:-4px;width:8px;cursor:ew-resize}.rh.w{top:12px;bottom:12px;left:-4px;width:8px;cursor:ew-resize}
.rh.ne{right:-5px;top:-5px;width:14px;height:14px;cursor:nesw-resize}.rh.sw{left:-5px;bottom:-5px;width:14px;height:14px;cursor:nesw-resize}
.rh.nw{left:-5px;top:-5px;width:14px;height:14px;cursor:nwse-resize}.rh.se{right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize}
.zoomrow{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);flex-wrap:wrap;justify-content:center}
.zoomrow .btn{padding:1px 8px}
.aboutbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.aboutbtns a{text-decoration:none;display:inline-block}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:14px;line-height:1.3}
.gh{margin:0 0 4px;font-size:18px;color:var(--title);letter-spacing:1px}
.gl{margin:0;padding-left:18px}.gl li{margin-bottom:6px}
.dlg:has(.gcols){max-height:690px}
.vt{color:#6fe3a6}.ou{color:var(--y)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.kb.h{display:grid;grid-template-columns:auto auto;grid-template-areas:"k l" "k v";column-gap:5px;align-items:center;justify-items:start}
.kb.h .knob{grid-area:k}.kb.h .kl{grid-area:l;align-self:end}.kb.h .kv{grid-area:v;align-self:start;min-width:44px}

.cl .st{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--ink);display:flex;align-items:center;gap:6px;height:16px}
.cl .krow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-top:1px}
.cl .spd{display:flex;align-items:center;gap:6px;margin-top:3px}
.cl .spd .cap{color:var(--b);font-size:11px}
.bname{flex:1;min-width:0;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname small{font-weight:600;color:var(--dim);font-size:11px;letter-spacing:.6px;margin-left:5px;font-family:var(--font-num)}
.ctr .gtop{gap:10px}
.ctr .gtop .mixk{margin-left:12px}
.gtop .lst{margin-left:4px}
.limrow{display:flex;gap:4px;align-items:flex-end;justify-content:center}
.pmeters{display:flex;gap:4px;align-items:flex-start}
.p1 .sidecol .cap{color:var(--title)}
.cap.c1{color:var(--b)}.cap.c2{color:var(--g)}.cap.c3{color:var(--y)}.cap.c4{color:var(--pink)}
.tgb.auto{height:18px;margin-bottom:22px}
.dlg .dbody{overflow:hidden}
.pb .list{overflow:hidden}
.dlg textarea{overflow:hidden;resize:none}
.pgrow{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:6px;font-size:13px;color:var(--b);height:26px}
.pb{height:410px}
.pb{grid-template-columns:350px 1fr}

</style>
<div id="app" data-look="C">
  <div id="frame">
    <div id="stage">
      <div class="cheek" id="cheekL" data-tip="Double-click the wood to reset the window to 100%."><canvas></canvas></div>
      <div class="main">
        <header class="hdr">
          <div class="brand">
            <svg width="32" height="32" viewBox="0 0 64 64" aria-label="Cat head logo"><path d="M8 6 L24 22 H40 L56 6 L60 36 Q60 58 32 60 Q4 58 4 36 Z" fill="#FF7BB1"/><path d="M12 14 L21 23 H14 Z M52 14 L43 23 H50 Z" fill="#FBBDD0"/><ellipse cx="22" cy="36" rx="4" ry="5" fill="#16171a"/><ellipse cx="42" cy="36" rx="4" ry="5" fill="#16171a"/><path d="M29 44 H35 L32 48 Z" fill="#16171a"/><path d="M32 48 Q28 53 24 50 M32 48 Q36 53 40 50" stroke="#16171a" stroke-width="2" fill="none"/><path d="M2 40 H14 M2 46 H14 M62 40 H50 M62 46 H50" stroke="#FBBDD0" stroke-width="1.6"/></svg>
            <div style="display:flex;flex-direction:column;line-height:1"><span class="name" id="brandName"></span><span class="s87" id="brandSub"></span></div>
          </div>
          <div class="sp"></div>
          <div class="presetbar">
            <button class="btn" id="pPrev" data-tip="Previous preset ([).">&#9664;</button>
            <button class="btn pname" id="pName" data-tip="Open the preset browser. Double-click to rename your own presets.">Start Here</button>
            <button class="btn" id="pNext" data-tip="Next preset (]).">&#9654;</button>
            <button class="btn" id="pSave" data-tip="Save these settings as your own preset. Asks before overwriting.">Save</button>
          </div>
          <div class="sp"></div>
          <button class="btn" id="bBypass" aria-pressed="false" data-tip="Bypass (B): hear the dry signal, delayed to match, to compare with the processed sound. The meters keep moving.">Bypass</button>
          <button class="btn" id="bGuide" data-tip="Short guide, what is verified and what is our own choice, and keyboard shortcuts.">Guide</button>
          <button class="btn" id="bSettings" data-tip="Info bubbles, power saving, colour look.">Settings</button>
          <button class="btn" id="bAbout" data-tip="About, support and where your files live.">About &amp; Support</button>
        </header>
        <div class="body" id="bodyArea">
          <section class="page" id="page1"></section>
          <section class="rig">
            <button class="btn" id="rigPlay" data-tip="Start or stop the preview sound (Space). The meters and displays move even when it is stopped.">&#9654; Play</button>
            <select id="rigSrc" aria-label="Preview source" data-tip="Test sound for the preview rig. Kick only and Offbeat bass are handy for judging Attack and Sustain."><option value="mix">Full mix loop</option><option value="kick">Kick only</option><option value="kb">Hardstyle kick + offbeat bass</option><option value="drums">Drum loop</option><option value="bass">Offbeat bass</option><option value="lead">Supersaw lead</option><option value="file">Your file</option></select>
            <button class="btn" id="rigFile" data-tip="Load your own audio file for the preview. Nothing is uploaded; it is decoded in this page only.">Load file</button>
            <input type="file" id="rigFileIn" accept="audio/*" hidden>
            <label data-tip="Preview level (preview only). Quiet: as generated. Loud: up to 6 dB hotter, peaks kept at -1 dB. Mastered: peaks at -0.5 dB, like a finished track. No level ever clips the rig or tickles the master limiter on its own, so 0% Mix is the untouched sound. The Input gain knob of the plugin does the same job on your own music.">Level <select id="rigLvl" aria-label="Preview level"><option value="0">Quiet</option><option value="6" selected>Loud</option><option value="10">Mastered</option></select></label>
            <button class="tgb" id="rigLM" aria-pressed="false" style="height:24px;font-size:13px" data-tip="Level match (preview only): the shaped sound is turned up or down to the same average loudness as the dry sound, so A/B (B key) compares punch and sustain instead of volume. Uses a 0.5 s average. Loops play at 150 BPM.">Level match</button>
            <div class="sp"></div>
            <span class="rd" id="rigRd" data-tip="Live comparison of the shaped sound against the dry input (after input gain), averaged over about half a second. RMS: average level change in dB. Crest: peak minus RMS, dry then shaped. LU at equal peak: how much louder the shaped sound can be played before its peak reaches the dry peak (dry crest minus shaped crest). Mix and Level match show up here."></span>
            <div class="tag" data-tip="This strip only exists in the design mockup. The plugin itself has no preview rig.">Preview rig, not plugin</div>
          </section>
        </div>
        <footer class="foot"><span id="footTxt"></span><span id="winsz">1280 &times; 720</span></footer>
      </div>
      <div class="cheek" id="cheekR" data-tip="Double-click the wood to reset the window to 100%."><canvas></canvas></div>
      <div id="modal" hidden></div>
      <div id="tip" hidden></div>
      <div id="toast" hidden></div>
    </div>
    <div class="rh n" data-h="n"></div><div class="rh s" data-h="s"></div><div class="rh e" data-h="e"></div><div class="rh w" data-h="w"></div>
    <div class="rh ne" data-h="ne"></div><div class="rh nw" data-h="nw"></div><div class="rh se" data-h="se"></div><div class="rh sw" data-h="sw"></div>
  </div>
  <div class="zoomrow"><button class="btn" id="zMinus" aria-label="Smaller">&minus;</button><button class="btn" id="zPct">100%</button><button class="btn" id="zPlus" aria-label="Larger">+</button><span>Drag any edge or corner to resize. Double-click the wood to reset.</span></div>
</div>

<script>
(function(){
'use strict';

function validPreset(o){if(!o||typeof o!=='object'||typeof o.name!=='string'||!o.name||o.name.length>60||!o.p||typeof o.p!=='object')return false;
 for(const k in o.p){if(!(k in PS))continue;const v=o.p[k],p=PS[k];if(typeof v!=='number'||!isFinite(v)||v<p.min-1e-9||v>p.max+1e-9)return false}return true}
try{userP=JSON.parse(localStorage.getItem(KEY+'-presets')||'[]').filter(validPreset)}catch(e){userP=[]}
const presetKeys=()=>Object.keys(PS).filter(k=>!PS[k].ui);
function normPreset(o){const p={};for(const k in o.p)if(k in PS&&!PS[k].ui)p[k]=o.p[k];return{name:String(o.name).slice(0,60),type:TYPES.includes(o.type)?o.type:'Utility',tags:Array.isArray(o.tags)?o.tags.filter(t=>typeof t==='string').slice(0,8).map(t=>t.slice(0,20)):[],tryOn:SRCNAME[o.tryOn]?o.tryOn:'mix',p,factory:false}}
function saveUser(){try{localStorage.setItem(KEY+'-presets',JSON.stringify(userP))}catch(e){}}
let curName='Start Here';
const allPresets=()=>FACT.concat(userP);

const nz=i=>((Math.imul(i|0,1664525)+1013904223)>>>0)/2147483648-1;

function renderSources(fs){const N=Math.round(8*SPB*fs),mk=()=>({L:new Float32Array(N),R:new Float32Array(N)});
 const add=(b,t0,dur,fn,gl,gr)=>{const i0=Math.round(t0*fs),n=Math.round(dur*fs);for(let k=0;k<n;k++){const i=(i0+k)%N,v=fn(k/fs,k);b.L[i]+=v*gl;b.R[i]+=v*gr}};
 const kickF=(t,k)=>{const ph=2*Math.PI*(46*t+154*(1-Math.exp(-45*t))/45),env=Math.exp(-t*6.5)*(1-Math.exp(-t*1500));return(Math.tanh(1.8*Math.sin(ph))/Math.tanh(1.8)*env+(t<.003?nz(k)*(1-t/.003)*.3:0))*.9};
 const K=mk(),B=mk(),H=mk(),C=mk(),CH=mk(),LD=mk();
 for(let b=0;b<8;b++)add(K,b*SPB,.4,kickF,1,1);
 let lp=0;for(let b=0;b<8;b++){const t0=b*SPB+SPB/2;let ph=0;const dt=55/fs;add(B,t0,.19,(t,k)=>{ph+=dt;if(ph>=1)ph-=1;const s=2*ph-1-pblep(ph,dt);lp+=(s-lp)*.07;const env=Math.min(1,t/.004)*Math.min(1,(.19-t)/.02);return(lp*1.4+Math.sin(2*Math.PI*55*t)*.6)*env*.55},1,1)}
 for(let b=0;b<16;b++){add(H,b*SPB/2+SPB/4,.08,(t,k)=>(nz(k*7+b)-nz(k*7+b-1))*Math.exp(-t*70)*.16,1,1)}
 for(let b=1;b<8;b+=2)add(C,b*SPB,.25,(t,k)=>(nz(k*3+b)*Math.exp(-t*16)*.55+Math.sin(2*Math.PI*190*t)*Math.exp(-t*28)*.3)*.7,1,1);
 const ch=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];ch.forEach((nt,c)=>{nt.forEach(m=>{for(let v=0;v<7;v++){const f=440*Math.pow(2,(m-69)/12)*Math.pow(2,(v-3)*.06/12*2);let ph=(v*.137)%1;const dt=f/fs,pan=(v-3)/3*.8;add(CH,c*2*SPB,2*SPB*.96,(t,k)=>{ph+=dt;if(ph>=1)ph-=1;const s=2*ph-1-pblep(ph,dt);const env=Math.min(1,t/.012)*Math.min(1,(2*SPB*.96-t)/.05)*(.55+.45*Math.exp(-t*3));return s*env*.05},Math.cos((pan+1)*Math.PI/4)*1.2,Math.sin((pan+1)*Math.PI/4)*1.2)}})});
 const mel=[69,0,72,0,76,0,72,69,0,67,0,72,0,76,79,0,81,0,79,0,76,0,72,76,0,74,0,72,69,0,67,72];
 mel.forEach((m,k)=>{if(!m)return;for(let v=0;v<5;v++){const f=440*Math.pow(2,(m-69)/12)*Math.pow(2,(v-2)*.07/12*2);let ph=(v*.21)%1;const dt=f/fs,pan=(v-2)/2*.7;add(LD,k*SPB/4,.40,(t,kk)=>{ph+=dt;if(ph>=1)ph-=1;const s=2*ph-1-pblep(ph,dt);return s*Math.min(1,t/.004)*Math.min(1,(.40-t)/.03)*(.35+.65*Math.exp(-t*6))*.1},Math.cos((pan+1)*Math.PI/4),Math.sin((pan+1)*Math.PI/4))}});
 const mix=(parts,rmsDb)=>{const o={L:new Float32Array(N),R:new Float32Array(N)};parts.forEach(([b,g])=>{for(let i=0;i<N;i++){o.L[i]+=b.L[i]*g;o.R[i]+=b.R[i]*g}});let pk=0,ss=0;for(let i=0;i<N;i++){pk=Math.max(pk,Math.abs(o.L[i]),Math.abs(o.R[i]));ss+=(o.L[i]*o.L[i]+o.R[i]*o.R[i])*.5}

 /* realistic levels: lead about -18 dBFS RMS, full mix about -14, kick+bass -14, drums -16 (peak capped at -0.3 dBFS) */
 SRC={mix:mix([[K,1],[B,.9],[H,.8],[C,.8],[CH,1],[LD,.6]],-14),kb:mix([[K,1],[B,1]],-14),kick:mix([[K,1]],-16),bass:mix([[B,1]],-16),lead:mix([[LD,1]],-18),drums:mix([[K,1],[H,1.2],[C,1]],-16),N};
 const pkOf=o=>{let p=1e-9;for(let i=0;i<N;i++){const a=Math.abs(o.L[i]),b=Math.abs(o.R[i]);if(a>p)p=a;if(b>p)p=b}return p};

/* Level, peak aware so the rig never clips and the dry copy never tickles the master limiter (ceiling -0.3):
   Quiet = as generated. Loud = +6 dB but peaks kept at or under -1 dBFS. Mastered = normalised to -0.5 dBFS peak. */
function updSrcG(){const pk=(srcKind==='file'&&fileBuf)?filePk*.8:(SRC&&SRC.pk?SRC.pk[srcKind]:1)||1;

 const useFile=srcKind==='file'&&fileBuf,b=useFile?null:SRC[srcKind];
 for(let i=0;i<n;i++){let l,r;if(useFile){const s=fileBuf[(pos+i)%fileBuf.length];l=r=s*.8}else{const k=(pos+i)%N;l=b.L[k];r=b.R[k]}if(srcG!==1){l*=srcG;r*=srcG}if(l>.995)l=.995;else if(l<-.995)l=-.995;if(r>.995)r=.995;else if(r<-.995)r=-.995;L[i]=l;R[i]=r}}

$('#bGuide').onclick=()=>openModal('Guide',`<div class="gcols"><div><h3 class="gh">What is it?</h3><ul class="gl">
<li><b>A transient shaper with split bands.</b> It turns the first hit of a sound (Attack) and what comes after it (Sustain) up or down, in up to four frequency bands, so you choose which part of the sound it works on. A limiter at the end keeps the level safe.</li>
<li><b>How it tells hit from tail:</b> two level followers, a fast one and a slow one, watch each band. When the fast one is above the slow one a hit is starting (attack). When it is below, the sound is dying away (sustain). The difference in dB, not the level, drives the gain, so it works the same on quiet and loud material.</li>
<li><b>Threshold</b> keeps it from boosting noise: below it the band is left alone. <b>Max dB</b> limits how far a band can be pushed.</li>
<li><b>Listen:</b> Transients plays only the attack part, Sustain only the rest; the two add up to the shaped sound.</li>
<li><b>Mix</b> blends against the true input, delayed to match, so Mix 0% is exactly the input. Not affiliated with anyone.</li></ul>
<h3 class="gh">Where to start</h3><ul class="gl"><li>Load Start Here, play Kick only or Drum loop, set a band to Attack +50, then press <kbd>B</kbd> to compare. Try Listen: Transients to hear what you are boosting.</li><li>Thicken a lead: Supersaw Body or Lead Thicken, then play Supersaw lead.</li></ul>
<h3 class="gh">Keys</h3><table><tr><td><kbd>Space</kbd></td><td>Play or stop the preview</td></tr><tr><td><kbd>B</kbd></td><td>Bypass (A/B)</td></tr><tr><td><kbd>[</kbd> <kbd>]</kbd></td><td>Previous or next preset</td></tr><tr><td>Knobs</td><td>Drag, wheel, arrows; Shift for fine; double-click resets</td></tr></table></div>
<div><h3 class="gh">What is verified and what is ours</h3><p><span class="vt">Given to us by the maker (the brief):</span> the control set (Input and Output gain, Mix, 1 to 4 bands with draggable crossovers, slope menu 12 to 96 dB/oct with 24 as default, per band On, Mute, Solo, Attack, Sustain, Speed, Threshold, Max gain, Output and Mix, Listen All, Transients or Sustain, limiter with Ceiling, Release with Auto and Lookahead 1 to 7.5 ms with 3 as default), the scope colours (red original, green shaped, grey overlap), and dB scales on every meter. The crossover, limiter and spectrum code is reused from our MultiPaw mockup, where the bands were tested to add back flat.</p>
<p><span class="ou">Ours (our own DSP choices; we had no source for any commercial transient shaper):</span> everything that decides the sound. Two peak followers on the stereo linked rectified band signal (fast about 1 ms attack and 20 ms release, slow about 20 ms and 120 ms at Medium; Fast and Slow scale them; low bands are slowed down so a bass tone is not mistaken for hits). Difference in dB, 1 dB dead zone, Attack gain 1.5 dB per dB of difference at 100%, Sustain 4 dB per dB at 100%, soft limit at Max dB, gain smoothing 0.5 ms up and 5 ms down, soft gate over the Threshold. The audio is delayed 1 ms against the detector so the gain is ready when a hit arrives. Listen weights the attack and sustain parts by how far the difference is from zero (6 dB wide cross-fade). Crossovers are Linkwitz-Riley with all-pass compensation. The limiter is a lookahead limiter with a sliding minimum and a moving average; Auto release is 30 ms plus 10 ms per dB of reduction. The factory presets are starting points: we measured them, we cannot listen.</p>
<p>Signal flow: Input gain, crossover, per band (detector, gain, 1 ms delay, Mix, Output, Mute and Solo), sum, Mix against the delayed true input, Output gain, limiter. Bypass plays the delayed input. This unit keeps its parameter ids stable (m.* and b0.* to b3.*) so it can also live inside CatRack.</p></div></div>`,null,'1100px');
